<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nordhälsa Klinik — Modern Vård i Stockholm</title>
  <meta name="description" content="Nordhälsa Klinik i Stockholm erbjuder modern sjukvård, fysioterapi och specialisttjänster med nordisk filosofi.">

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-router-dom@6.28.0/dist/react-router-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ===== Reset & Base ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --nh-bg: #f7f6f3;
      --nh-surface: #ffffff;
      --nh-text: #1a1f2e;
      --nh-text-soft: #5a6178;
      --nh-accent: #4a7c6f;
      --nh-accent-dark: #356b5e;
      --nh-accent-soft: #e8f0ed;
      --nh-border: #e2e0db;
      --nh-warm: #f0ebe3;
      --nh-shadow: 0 4px 24px rgba(26,31,46,0.06);
      --nh-shadow-lg: 0 12px 48px rgba(26,31,46,0.1);
      --nh-radius: 14px;
      --nh-radius-sm: 8px;
      --nh-transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--nh-bg);
      color: var(--nh-text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, h4 {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }
    a { text-decoration: none; color: inherit; }
    img { max-width: 100%; display: block; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    input, textarea, select { font-family: inherit; }

    /* ===== Layout ===== */
    .nh-app { min-height: 100vh; display: flex; flex-direction: column; }
    .nh-main { flex: 1; }

    /* ===== Navbar ===== */
    .nh-nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(247, 246, 243, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--nh-border);
      transition: box-shadow var(--nh-transition);
    }
    .nh-nav__inner {
      max-width: 1200px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 1.5rem;
    }
    .nh-nav__logo {
      display: flex; align-items: center; gap: 0.5rem;
      font-family: 'Fraunces', serif;
      font-size: 1.4rem; font-weight: 600;
      color: var(--nh-text); letter-spacing: -0.02em;
    }
    .nh-nav__logo-mark {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--nh-accent);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 1.1rem; font-weight: 700;
      font-family: 'Fraunces', serif;
    }
    .nh-nav__links { display: flex; align-items: center; gap: 0.3rem; list-style: none; }
    .nh-nav__link {
      padding: 0.5rem 1rem; border-radius: var(--nh-radius-sm);
      font-size: 0.95rem; font-weight: 500; color: var(--nh-text-soft);
      transition: color var(--nh-transition), background var(--nh-transition);
    }
    .nh-nav__link:hover { color: var(--nh-text); background: var(--nh-accent-soft); }
    .nh-nav__link--active { color: var(--nh-accent); background: var(--nh-accent-soft); }
    .nh-nav__cta {
      padding: 0.6rem 1.4rem; border-radius: 999px;
      background: var(--nh-accent); color: #fff;
      font-size: 0.9rem; font-weight: 600;
      transition: background var(--nh-transition), transform var(--nh-transition);
    }
    .nh-nav__cta:hover { background: var(--nh-accent-dark); transform: translateY(-1px); }
    .nh-nav__toggle { display: none; flex-direction: column; gap: 5px; padding: 0.5rem; }
    .nh-nav__toggle span { width: 24px; height: 2px; background: var(--nh-text); border-radius: 2px; transition: var(--nh-transition); }

    /* ===== Buttons ===== */
    .nh-btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.8rem 1.8rem; border-radius: 999px;
      font-size: 1rem; font-weight: 600;
      transition: all var(--nh-transition);
    }
    .nh-btn--primary { background: var(--nh-accent); color: #fff; }
    .nh-btn--primary:hover { background: var(--nh-accent-dark); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(74,124,111,0.3); }
    .nh-btn--secondary { background: transparent; color: var(--nh-text); border: 1.5px solid var(--nh-border); }
    .nh-btn--secondary:hover { border-color: var(--nh-accent); color: var(--nh-accent); }
    .nh-btn--white { background: #fff; color: var(--nh-text); }
    .nh-btn--white:hover { transform: translateY(-2px); box-shadow: var(--nh-shadow-lg); }

    /* ===== Hero (Home) ===== */
    .nh-hero {
      position: relative; overflow: hidden;
      padding: 5rem 1.5rem 6rem;
      background: linear-gradient(170deg, var(--nh-accent-soft) 0%, var(--nh-bg) 60%);
    }
    .nh-hero__inner { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; align-items: center; }
    .nh-hero__tag {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.4rem 1rem; border-radius: 999px;
      background: #fff; border: 1px solid var(--nh-border);
      font-size: 0.85rem; font-weight: 500; color: var(--nh-accent);
      margin-bottom: 1.5rem;
    }
    .nh-hero__tag-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--nh-accent); }
    .nh-hero__title { font-size: clamp(2.2rem, 4.5vw, 3.8rem); margin-bottom: 1.2rem; }
    .nh-hero__title em { font-style: italic; color: var(--nh-accent); font-weight: 500; }
    .nh-hero__text { font-size: 1.15rem; color: var(--nh-text-soft); margin-bottom: 2rem; max-width: 480px; }
    .nh-hero__actions { display: flex; gap: 1rem; flex-wrap: wrap; }
    .nh-hero__image-wrap { position: relative; }
    .nh-hero__image {
      border-radius: 24px; overflow: hidden; aspect-ratio: 4/5;
      box-shadow: var(--nh-shadow-lg);
    }
    .nh-hero__image img { width: 100%; height: 100%; object-fit: cover; }
    .nh-hero__card {
      position: absolute; bottom: -1.5rem; left: -1.5rem;
      background: var(--nh-surface); border-radius: var(--nh-radius);
      padding: 1.2rem 1.5rem; box-shadow: var(--nh-shadow-lg);
      display: flex; align-items: center; gap: 1rem; max-width: 280px;
    }
    .nh-hero__card-icon {
      width: 48px; height: 48px; border-radius: 12px;
      background: var(--nh-accent-soft); display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
    }
    .nh-hero__card-title { font-size: 0.85rem; font-weight: 600; font-family: 'Inter', sans-serif; letter-spacing: 0; }
    .nh-hero__card-text { font-size: 0.8rem; color: var(--nh-text-soft); }

    /* ===== Section ===== */
    .nh-section { padding: 5rem 1.5rem; }
    .nh-section--alt { background: var(--nh-warm); }
    .nh-section__inner { max-width: 1200px; margin: 0 auto; }
    .nh-section__header { text-align: center; max-width: 640px; margin: 0 auto 3.5rem; }
    .nh-section__eyebrow {
      font-size: 0.85rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.12em; color: var(--nh-accent); margin-bottom: 0.8rem;
    }
    .nh-section__title { font-size: clamp(1.8rem, 3.5vw, 2.8rem); margin-bottom: 1rem; }
    .nh-section__text { font-size: 1.1rem; color: var(--nh-text-soft); }

    /* ===== Treatment Cards ===== */
    .nh-treat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
    .nh-treat-card {
      background: var(--nh-surface); border-radius: var(--nh-radius);
      padding: 2rem; border: 1px solid var(--nh-border);
      transition: transform var(--nh-transition), box-shadow var(--nh-transition), border-color var(--nh-transition);
    }
    .nh-treat-card:hover { transform: translateY(-4px); box-shadow: var(--nh-shadow-lg); border-color: var(--nh-accent); }
    .nh-treat-card__icon {
      width: 56px; height: 56px; border-radius: 14px;
      background: var(--nh-accent-soft); display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; margin-bottom: 1.5rem;
    }
    .nh-treat-card__title { font-size: 1.3rem; margin-bottom: 0.6rem; }
    .nh-treat-card__text { color: var(--nh-text-soft); font-size: 0.95rem; margin-bottom: 1.2rem; }
    .nh-treat-card__link { color: var(--nh-accent); font-weight: 600; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 0.4rem; }
    .nh-treat-card__link span { transition: transform var(--nh-transition); }
    .nh-treat-card:hover .nh-treat-card__link span { transform: translateX(4px); }

    /* ===== Feature Split ===== */
    .nh-split { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: center; }
    .nh-split__image { border-radius: 24px; overflow: hidden; aspect-ratio: 5/4; box-shadow: var(--nh-shadow); }
    .nh-split__image img { width: 100%; height: 100%; object-fit: cover; }
    .nh-split__title { font-size: clamp(1.6rem, 3vw, 2.4rem); margin-bottom: 1.2rem; }
    .nh-split__text { color: var(--nh-text-soft); font-size: 1.05rem; margin-bottom: 1.5rem; }
    .nh-split__list { list-style: none; display: flex; flex-direction: column; gap: 0.8rem; }
    .nh-split__item { display: flex; align-items: flex-start; gap: 0.8rem; }
    .nh-split__check {
      width: 24px; height: 24px; border-radius: 50%; background: var(--nh-accent);
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 0.75rem; font-weight: 700; margin-top: 2px;
    }
    .nh-split__item-text { font-weight: 500; font-size: 0.98rem; }

    /* ===== Stats ===== */
    .nh-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2rem; }
    .nh-stat { text-align: center; }
    .nh-stat__num { font-family: 'Fraunces', serif; font-size: clamp(2rem, 4vw, 3.2rem); font-weight: 700; color: var(--nh-accent); }
    .nh-stat__label { font-size: 0.9rem; color: var(--nh-text-soft); margin-top: 0.3rem; }

    /* ===== CTA Banner ===== */
    .nh-cta {
      background: var(--nh-accent); border-radius: 24px;
      padding: 4rem 3rem; text-align: center; max-width: 1100px;
      margin: 0 auto; position: relative; overflow: hidden;
    }
    .nh-cta::before {
      content: ''; position: absolute; top: -50%; right: -10%;
      width: 400px; height: 400px; border-radius: 50%;
      background: rgba(255,255,255,0.07);
    }
    .nh-cta::after {
      content: ''; position: absolute; bottom: -40%; left: -5%;
      width: 300px; height: 300px; border-radius: 50%;
      background: rgba(255,255,255,0.05);
    }
    .nh-cta__inner { position: relative; z-index: 1; }
    .nh-cta__title { color: #fff; font-size: clamp(1.6rem, 3vw, 2.6rem); margin-bottom: 1rem; }
    .nh-cta__text { color: rgba(255,255,255,0.85); font-size: 1.1rem; margin-bottom: 2rem; max-width: 520px; margin-left: auto; margin-right: auto; }

    /* ===== Page Hero (sub pages) ===== */
    .nh-page-hero { padding: 4rem 1.5rem 3rem; background: var(--nh-accent-soft); }
    .nh-page-hero__inner { max-width: 1200px; margin: 0 auto; }
    .nh-page-hero__breadcrumb { font-size: 0.85rem; color: var(--nh-text-soft); margin-bottom: 1rem; }
    .nh-page-hero__title { font-size: clamp(2rem, 4vw, 3.2rem); margin-bottom: 0.8rem; }
    .nh-page-hero__text { font-size: 1.1rem; color: var(--nh-text-soft); max-width: 600px; }

    /* ===== Detailed Treatments ===== */
    .nh-dtreat-list { display: flex; flex-direction: column; gap: 4rem; }
    .nh-dtreat { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; align-items: center; }
    .nh-dtreat:nth-child(even) .nh-dtreat__image { order: 2; }
    .nh-dtreat__image { border-radius: 20px; overflow: hidden; aspect-ratio: 4/3; box-shadow: var(--nh-shadow); }
    .nh-dtreat__image img { width: 100%; height: 100%; object-fit: cover; }
    .nh-dtreat__cat { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--nh-accent); margin-bottom: 0.6rem; }
    .nh-dtreat__title { font-size: 1.8rem; margin-bottom: 0.8rem; }
    .nh-dtreat__text { color: var(--nh-text-soft); margin-bottom: 1.2rem; }
    .nh-dtreat__features { list-style: none; display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 1.5rem; }
    .nh-dtreat__feat { display: flex; align-items: center; gap: 0.6rem; font-size: 0.95rem; }
    .nh-dtreat__feat-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--nh-accent); flex-shrink: 0; }
    .nh-dtreat__price {
      display: flex; align-items: baseline; gap: 0.5rem; margin-bottom: 1.5rem;
      padding-top: 1rem; border-top: 1px solid var(--nh-border);
    }
    .nh-dtreat__price-num { font-family: 'Fraunces', serif; font-size: 1.8rem; font-weight: 600; color: var(--nh-text); }
    .nh-dtreat__price-label { font-size: 0.9rem; color: var(--nh-text-soft); }

    /* ===== About Page ===== */
    .nh-values { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
    .nh-value-card {
      background: var(--nh-surface); border-radius: var(--nh-radius);
      padding: 2.5rem 2rem; border: 1px solid var(--nh-border);
    }
    .nh-value-card__icon { font-size: 2.5rem; margin-bottom: 1rem; }
    .nh-value-card__title { font-size: 1.3rem; margin-bottom: 0.6rem; }
    .nh-value-card__text { color: var(--nh-text-soft); font-size: 0.95rem; }

    .nh-team { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem; }
    .nh-team-card { text-align: center; }
    .nh-team-card__img { border-radius: 16px; overflow: hidden; aspect-ratio: 3/4; margin-bottom: 1rem; box-shadow: var(--nh-shadow); }
    .nh-team-card__img img { width: 100%; height: 100%; object-fit: cover; }
    .nh-team-card__name { font-family: 'Fraunces', serif; font-size: 1.2rem; font-weight: 600; }
    .nh-team-card__role { font-size: 0.9rem; color: var(--nh-accent); margin-top: 0.2rem; }

    /* ===== Contact Page ===== */
    .nh-contact-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 3rem; }
    .nh-contact-info { display: flex; flex-direction: column; gap: 1.5rem; }
    .nh-contact-item {
      display: flex; gap: 1rem; align-items: flex-start;
      padding: 1.5rem; background: var(--nh-surface); border-radius: var(--nh-radius);
      border: 1px solid var(--nh-border);
    }
    .nh-contact-item__icon {
      width: 48px; height: 48px; border-radius: 12px;
      background: var(--nh-accent-soft); display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; flex-shrink: 0;
    }
    .nh-contact-item__label { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--nh-text-soft); margin-bottom: 0.2rem; }
    .nh-contact-item__value { font-size: 1rem; font-weight: 500; }

    .nh-form { background: var(--nh-surface); border-radius: var(--nh-radius); padding: 2.5rem; border: 1px solid var(--nh-border); }
    .nh-form__title { font-size: 1.5rem; margin-bottom: 0.5rem; }
    .nh-form__text { color: var(--nh-text-soft); margin-bottom: 2rem; font-size: 0.95rem; }
    .nh-form__row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
    .nh-form__group { margin-bottom: 1rem; }
    .nh-form__label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--nh-text); }
    .nh-form__input, .nh-form__textarea, .nh-form__select {
      width: 100%; padding: 0.75rem 1rem; border: 1.5px solid var(--nh-border);
      border-radius: var(--nh-radius-sm); font-size: 0.95rem; background: var(--nh-bg);
      transition: border-color var(--nh-transition), box-shadow var(--nh-transition);
      color: var(--nh-text);
    }
    .nh-form__input:focus, .nh-form__textarea:focus, .nh-form__select:focus {
      outline: none; border-color: var(--nh-accent);
      box-shadow: 0 0 0 3px rgba(74,124,111,0.12);
    }
    .nh-form__textarea { min-height: 130px; resize: vertical; }
    .nh-form__msg {
      padding: 1rem; border-radius: var(--nh-radius-sm);
      background: var(--nh-accent-soft); color: var(--nh-accent-dark);
      font-size: 0.9rem; font-weight: 500; margin-bottom: 1rem;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .nh-form__map { margin-top: 2rem; border-radius: var(--nh-radius); overflow: hidden; border: 1px solid var(--nh-border); }
    .nh-form__map img { width: 100%; height: 280px; object-fit: cover; filter: saturate(0.8); }

    /* ===== Footer ===== */
    .nh-footer { background: var(--nh-text); color: rgba(255,255,255,0.7); padding: 4rem 1.5rem 2rem; margin-top: auto; }
    .nh-footer__inner { max-width: 1200px; margin: 0 auto; }
    .nh-footer__top { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 2rem; padding-bottom: 3rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .nh-footer__logo { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem; color: #fff; font-family: 'Fraunces', serif; font-size: 1.4rem; font-weight: 600; }
    .nh-footer__logo-mark { width: 36px; height: 36px; border-radius: 50%; background: var(--nh-accent); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; }
    .nh-footer__desc { font-size: 0.9rem; max-width: 280px; margin-bottom: 1.5rem; }
    .nh-footer__col-title { color: #fff; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 1rem; }
    .nh-footer__links { list-style: none; display: flex; flex-direction: column; gap: 0.6rem; }
    .nh-footer__link { font-size: 0.9rem; color: rgba(255,255,255,0.65); transition: color var(--nh-transition); }
    .nh-footer__link:hover { color: #fff; }
    .nh-footer__bottom { display: flex; justify-content: space-between; align-items: center; padding-top: 2rem; font-size: 0.85rem; }
    .nh-footer__social { display: flex; gap: 0.8rem; }
    .nh-footer__social a {
      width: 38px; height: 38px; border-radius: 50%;
      background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem; transition: background var(--nh-transition);
    }
    .nh-footer__social a:hover { background: var(--nh-accent); }

    /* ===== Animations ===== */
    @keyframes nhFadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    .nh-fade { animation: nhFadeUp 0.6s ease-out both; }
    .nh-fade-delay-1 { animation-delay: 0.1s; }
    .nh-fade-delay-2 { animation-delay: 0.2s; }
    .nh-fade-delay-3 { animation-delay: 0.3s; }

    /* ===== Responsive ===== */
    @media (max-width: 968px) {
      .nh-hero__inner { grid-template-columns: 1fr; }
      .nh-hero__image-wrap { max-width: 420px; margin: 0 auto; }
      .nh-treat-grid { grid-template-columns: 1fr 1fr; }
      .nh-split, .nh-dtreat { grid-template-columns: 1fr; gap: 2rem; }
      .nh-dtreat:nth-child(even) .nh-dtreat__image { order: 0; }
      .nh-stats { grid-template-columns: 1fr 1fr; gap: 2rem; }
      .nh-values { grid-template-columns: 1fr; }
      .nh-team { grid-template-columns: 1fr 1fr; }
      .nh-contact-grid { grid-template-columns: 1fr; }
      .nh-footer__top { grid-template-columns: 1fr 1fr; gap: 2rem; }
    }
    @media (max-width: 640px) {
      .nh-nav__links { display: none; }
      .nh-nav__toggle { display: flex; }
      .nh-nav__links--open {
        display: flex; flex-direction: column; position: absolute; top: 100%; left: 0; right: 0;
        background: var(--nh-surface); border-bottom: 1px solid var(--nh-border);
        padding: 1rem; gap: 0.3rem; box-shadow: var(--nh-shadow);
      }
      .nh-treat-grid { grid-template-columns: 1fr; }
      .nh-stats { grid-template-columns: 1fr 1fr; }
      .nh-team { grid-template-columns: 1fr 1fr; }
      .nh-form__row { grid-template-columns: 1fr; }
      .nh-footer__top { grid-template-columns: 1fr; }
      .nh-footer__bottom { flex-direction: column; gap: 1rem; text-align: center; }
      .nh-cta { padding: 2.5rem 1.5rem; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { BrowserRouter, Routes, Route, Link, NavLink, useLocation } = ReactRouterDOM;

    /* ===== Data ===== */
    const treatments = [
      {
        id: 'fysioterapi',
        cat: 'Fysioterapi',
        title: 'Fysioterapi & Rehabilitering',

                      <div className="nh-contact-item__value">08-555 123 45</div>
                    </div>
                  </div>
                  <div className="nh-contact-item">
                    <span className="nh-contact-item__icon">✉️</span>
                    <div>
                      <div className="nh-contact-item__label">E-post</div>
                      <div className="nh-contact-item__value">hej@nordhalsa.se</div>
                    </div>
                  </div>
                  <div className="nh-contact-item">
                    <span className="nh-contact-item__icon">🕐</span>
                    <div>
                      <div className="nh-contact-item__label">Öppettider</div>
                      <div className="nh-contact-item__value">Mån–Fre 07–19 · Lör 09–15</div>
                    </div>
                  </div>
                  <div className="nh-form__map">
                    <img src="https://images.unsplash.com/photo-1524661135604-4fa9e1bca653?auto=format&fit=crop&w=1600&q=80" alt="Karta över Stockholms innerstad med markör vid klinikens adress" loading="lazy" />
                  </div>
                </div>

                {/* Form */}
                <div className="nh-form">
                  <h2 className="nh-form__title">Boka tid eller fråga</h2>
                  <p className="nh-form__text">Fyll i formuläret så kontaktar vi dig inom 24 timmar. Vid akut behov, ring oss direkt.</p>

                  {submitted && (
                    <div className="nh-form__msg">
                      ✓ Tack! Vi har tagit emot ditt meddelande och återkommer snart.
                    </div>
                  )}

                  <form onSubmit={handleSubmit}>
                    <div className="nh-form__row">
                      <div className="nh-form__group">
                        <label className="nh-form__label" htmlFor="nh-name">Namn</label>
                        <input className="nh-form__input" id="nh-name" name="name" type="text" required value={form.name} onChange={handleChange} placeholder="För- och efternamn" />
                      </div>
                      <div className="nh-form__group">
                        <label className="nh-form__label" htmlFor="nh-phone">Telefon</label>
                        <input className="nh-form__input" id="nh-phone" name="phone" type="tel" value={form.phone} onChange={handleChange} placeholder="070-123 45 67" />
                      </div>
                    </div>
                    <div className="nh-form__group">
                      <label className="nh-form__label" htmlFor="nh-email">E-post</label>
                      <input className="nh-form__input" id="nh-email" name="email" type="email" required value={form.email} onChange={handleChange} placeholder="din@email.se" />
                    </div>
                    <div className="nh-form__group">
                      <label className="nh-form__label" htmlFor="nh-treatment">Önskad behandling</label>
                      <select className="nh-form__select" id="nh-treatment" name="treatment" value={form.treatment} onChange={handleChange}>
                        <option value="">Välj behandling...</option>
                        {treatments.map(t => (
                          <option key={t.id} value={t.title}>{t.title}</option>
                        ))}
                        <option value="Annat">Annat / Osäker</option>
                      </select>
                    </div>
                    <div className="nh-form__group">
                      <label className="nh-form__label" htmlFor="nh-message">Meddelande</label>
                      <textarea className="nh-form__textarea" id="nh-message" name="message" value={form.message} onChange={handleChange} placeholder="Beskriv kort vad du behöver hjälp med eller när du föredrar att komma..."></textarea>
                    </div>
                    <button type="submit" className="nh-btn nh-btn--primary" style={{ width: '100%', justifyContent: 'center' }}>
                      Skicka förfrågan →
                    </button>
                  </form>
                </div>
              </div>
            </div>
          </section>
        </>
      );
    }

    /* ===== App ===== */
    function App() {
      return (
        <BrowserRouter>
          <ScrollToTop />
          <div className="nh-app">
            <Navbar />
            <main className="nh-main">
              <Routes>
                <Route path="/" element={<HomePage />} />
                <Route path="/behandlingar" element={<TreatmentsPage />} />
                <Route path="/om-oss" element={<AboutPage />} />
                <Route path="/kontakt" element={<ContactPage />} />
                <Route path="*" element={<HomePage />} />
              </Routes>
            </main>
            <Footer />
          </div>
        </BrowserRouter>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
